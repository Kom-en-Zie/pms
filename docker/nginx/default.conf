# Serves the Compose (Wasm) web app and proxies /api to the backend, so the browser
# only ever talks to one origin (no CORS needed).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The Wasm and JS bundles are large and compress very well.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    client_max_body_size 20m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webpack gives .wasm files content-hashed names, so they can be cached forever.
    location ~* \.wasm$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (index.html, composeApp.js, resources) keeps a stable name: revalidate.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        # Client-side routes fall back to the app shell.
        try_files $uri $uri/ /index.html;
    }
}
