# =====================================================================
# PMS backend configuration
#
# Profiles: %dev (./gradlew :backend:quarkusDev), %test (tests), %prod (Docker image).
# Never commit real credentials: production values come from environment variables
# (see .env.example and compose.yaml).
# =====================================================================

quarkus.application.name=pms-backend

# --- HTTP / REST ----------------------------------------------------
# Every REST endpoint lives under /api (must match ApiPaths.BASE in :shared).
quarkus.rest.path=/api
# Health, metrics and dev endpoints stay under /q (not exposed through the web proxy).
quarkus.http.non-application-root-path=/q

# --- Datasource -----------------------------------------------------
quarkus.datasource.db-kind=postgresql
# dev/test: Quarkus Dev Services starts a throwaway PostgreSQL container automatically
# (requires a running Docker daemon). Pin it to the same major version as production.
quarkus.datasource.devservices.image-name=postgres:19-alpine
# prod: supplied by the container environment.
%prod.quarkus.datasource.jdbc.url=${PMS_DB_URL}
%prod.quarkus.datasource.username=${PMS_DB_USER}
%prod.quarkus.datasource.password=${PMS_DB_PASSWORD}

# --- Schema management ----------------------------------------------
# Flyway owns the schema; Hibernate must never generate or alter it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# --- OpenAPI ----------------------------------------------------------
quarkus.smallrye-openapi.info-title=PMS API
quarkus.smallrye-openapi.info-description=API of PMS, the Project Management System for the technical teams of Kom en Zie.
# Swagger UI is available in dev mode at /q/swagger-ui.

# --- Authentication ---------------------------------------------------
# Phase 1: no authentication (development only).
# Phase 2: OIDC with Planning Center via quarkus-oidc. See docs/authentication.md.
