version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["org.jetbrains.compose*", "org.jetbrains.androidx*"]
      ktor:
        patterns: ["io.ktor*"]
    ignore:
      # Kotlin and kotlinx must stay on the versions pinned by the Quarkus BOM.
      # Bump them by hand together with Quarkus (see gradle/libs.versions.toml).
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
